<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents – CPGE TSI</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#667085;--accent:#2b5fd9;--line:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{color:var(--muted);margin:0 0 24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.doc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.info{flex:1;min-width:0}.doc h3{margin:0;font-size:1rem}.doc p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.dl{background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.9rem;white-space:nowrap}
.disabled{background:#98a2b3;cursor:not-allowed}
@media(max-width:520px){.doc{flex-wrap:wrap}.dl{width:100%;text-align:center}}
</style>
</head>
<body>
<main>
<h1>Documents – CPGE TSI</h1>
<p class="sub">Cours, fiches et documents à télécharger.</p>
<div class="filters" id="filters"></div>
<div id="list"></div>
</main>

<script>
const DOCUMENTS = [
  {titre:"Programme de colle PC 2",description:"Semaine du 21/09 — fichier à ajouter",categorie:"Physique-Chimie",lien:null},
  {titre:"Fiche de lecture – L'Œuvre",description:"Fichier à ajouter",categorie:"Français",lien:null},
  {titre:"Savoirs en Informatique pour le Concours",description:"PDF officiel – CPGE TSI 1re année",categorie:"Informatique",lien:"./SavoirsInfoConcours.pdf"}
];

const list=document.getElementById("list");
const filters=document.getElementById("filters");
const cats=["Tous",...new Set(DOCUMENTS.map(d=>d.categorie))];
let current="Tous";

function render(){
  filters.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c;
    if(c===current)b.className="on";
    b.onclick=()=>{current=c;render()};
    filters.appendChild(b);
  });

  const docs=DOCUMENTS.filter(d=>current==="Tous"||d.categorie===current);
  list.innerHTML="";

  docs.forEach(d=>{
    const el=document.createElement("div");
    el.className="doc";

    const info=document.createElement("div");
    info.className="info";

    const h=document.createElement("h3");
    h.textContent=d.titre;
    info.appendChild(h);

    const p=document.createElement("p");
    p.textContent=d.description;
    info.appendChild(p);
    el.appendChild(info);

    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent=d.categorie;
    el.appendChild(tag);

    const a=document.createElement("a");
    a.className="dl";

    if(d.lien){
      a.href=d.lien;
      a.download="SavoirsInfoConcours.pdf";
      a.textContent="Télécharger le PDF";
    }else{
      a.className+=" disabled";
      a.textContent="Fichier non disponible";
      a.onclick=e=>e.preventDefault();
    }

    el.appendChild(a);
    list.appendChild(el);
  });
}
render();
</script>
</body>
</html>
