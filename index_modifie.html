<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documents – CPGE TSI</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#667085;--accent:#2b5fd9;--line:#e3e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--text:#e8eaf0;--muted:#98a2b3;--accent:#6c97ff;--line:#2d333f}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--text:#e8eaf0;--muted:#98a2b3;--accent:#6c97ff;--line:#2d333f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{color:var(--muted);margin:0 0 24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.doc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.doc .info{flex:1;min-width:0}
.doc h3{margin:0;font-size:1rem}
.doc p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.dl{background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.9rem;white-space:nowrap}
.dl:hover{opacity:.9}
.empty{color:var(--muted);text-align:center;padding:24px}
@media (max-width:520px){.doc{flex-wrap:wrap}.dl{width:100%;text-align:center}}
</style>
</head>
<body>
<main>
  <h1>Documents – CPGE TSI</h1>
  <p class="sub">Cours, fiches et documents de CPGE TSI à télécharger.</p>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>

<script>
/* ============================================================
   ÉDITER ICI : une ligne { } par document.
   - titre       : nom affiché
   - description : petite phrase (peut être vide "")
   - categorie   : sert aux boutons de filtre (ex: "Maths", "Physique")
   - lien        : lien de téléchargement (Drive, Dropbox, PDF hébergé...)
   ============================================================ */
const DOCUMENTS = [
  { titre: "Programme de colle PC 2", description: "Semaine du 21/09", categorie: "Physique-Chimie", lien: "#" },
  { titre: "Fiche de lecture – L'Œuvre", description: "Notes chapitre par chapitre", categorie: "Français", lien: "#" },
  { titre: "Savoirs en Informatique pour le Concours", description: "CPGE TSI 1re année – éléments à maîtriser pour l'épreuve écrite", categorie: "Informatique", lien: "#" },
  { titre: "Informatique – Traits généraux", description: "Typage dynamique, indentation, appel de fonction par valeur", categorie: "Informatique", lien: "#" },
  { titre: "Informatique – Types de base", description: "int, float, bool et comparaisons", categorie: "Informatique", lien: "#" },
  { titre: "Informatique – Types structurés", description: "Chaînes, tuples et listes : indices, concaténation, slicing, append, len", categorie: "Informatique", lien: "#" },
  { titre: "Informatique – Structures de contrôle", description: "Affectation, if/elif/else, while, break, for, range, fonctions et return", categorie: "Informatique", lien: "#" },
  { titre: "Informatique – Divers", description: "Commentaires, print, import, fichiers texte et assert", categorie: "Informatique", lien: "#" }
];

const list = document.getElementById('list');
const filters = document.getElementById('filters');
const cats = ["Tous", ...new Set(DOCUMENTS.map(d => d.categorie).filter(Boolean))];
let current = "Tous";

function render(){
  filters.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    if (c === current) b.className = 'on';
    b.onclick = () => { current = c; render(); };
    filters.appendChild(b);
  });
  const docs = DOCUMENTS.filter(d => current === "Tous" || d.categorie === current);
  list.innerHTML = docs.length ? "" : '<div class="empty">Aucun document.</div>';
  docs.forEach(d => {
    const el = document.createElement('div');
    el.className = 'doc';
    const info = document.createElement('div');
    info.className = 'info';
    const h = document.createElement('h3'); h.textContent = d.titre;
    info.appendChild(h);
    if (d.description){ const p = document.createElement('p'); p.textContent = d.description; info.appendChild(p); }
    el.appendChild(info);
    if (d.categorie){ const t = document.createElement('span'); t.className = 'tag'; t.textContent = d.categorie; el.appendChild(t); }
    const a = document.createElement('a');
    a.className = 'dl'; a.href = d.lien; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Télécharger';
    el.appendChild(a);
    list.appendChild(el);
  });
}
render();
</script>
</body>
</html>
